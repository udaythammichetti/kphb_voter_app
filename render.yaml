# Render Blueprint — use New → Blueprint, or New → Static Site with settings below.
# Do NOT use a Python Web Service / pip install.
services:
  - type: web
    name: kphb-voter-app
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
