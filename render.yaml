# Render Blueprint — Kukatpally (46) voter dashboard
# Use: New → Blueprint (Static Site). Do NOT create a Python Web Service.
services:
  - type: web
    name: kphb-voter-app
    runtime: static
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    # Relative to repository root
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
