# Render Blueprint — Static Site
services:
  - type: web
    name: kphb-voter-app
    runtime: static
    buildCommand: npm run build
    # Repo-root dist/ (copied from web/dist by npm run build)
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
